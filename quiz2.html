<!DOCTYPE html>
<html>
<head>
<title>HTML CBT Quiz</title>
<link rel="stylesheet" href="style.css">
  <style>
  body{
font-family:Arial;
background:#f4f4f4;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
padding:30px;
width:450px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
text-align:center;
}

input{
padding:10px;
width:80%;
margin-bottom:15px;
}

button{
padding:10px 15px;
border:none;
background:#2ecc71;
color:white;
cursor:pointer;
border-radius:5px;
margin-top:10px;
}

.option{
display:block;
background:#eee;
margin:10px;
padding:10px;
border-radius:5px;
cursor:pointer;
}

.option:hover{
background:#ddd;
}

.top-bar{
display:flex;
justify-content:space-between;
margin-bottom:15px;
}
  </style>
</head>

<body>

<div class="container">

<h1>HTML CBT Quiz</h1>

<div id="start-screen">
<input type="text" id="studentName" placeholder="Enter your name">
<button onclick="startQuiz()">Start Quiz</button>
</div>

<div id="quiz-screen" style="display:none;">

<div class="top-bar">
<span id="timer">Time: 60</span>
<span id="question-number"></span>
</div>

<h2 id="question"></h2>

<div id="options"></div>

<button id="nextBtn">Next Question</button>

</div>

<div id="result-screen" style="display:none;">
<h2 id="result"></h2>
<button type="submit" onclick="restart()">Restart</button>
</div>

</div>

<script>
  const quizData = [

{
question:"What does HTML stand for?",
options:[
"Hyper Text Markup Language",
"High Text Machine Language",
"Hyper Tool Multi Language",
"Home Tool Markup Language"
],
answer:0
},

{
question:"Which tag creates a paragraph?",
options:["paragraph","p","text","para"],
answer:1
},

{
question:"Which tag inserts an image?",
options:["img","pic","image","photo"],
answer:0
},

{
question:"Which tag creates a hyperlink?",
options:["link","a","href","url"],
answer:1
},

{
question:"Where is webpage content placed?",
options:["head","title","body","meta"],
answer:2
}

];

let currentQuestion = 0;
let score = 0;
let time = 60;
let timer;
let studentName = "";

function startQuiz(){

studentName = document.getElementById("studentName").value;

if(studentName === ""){
alert("Enter your name");
return;
}

document.getElementById("start-screen").style.display="none";
document.getElementById("quiz-screen").style.display="block";

startTimer();
loadQuestion();

}

function startTimer(){

timer = setInterval(function(){

time--;
document.getElementById("timer").innerText = "Time: " + time;

if(time <= 0){
clearInterval(timer);
showResult();
}

},1000);

}

function loadQuestion(){

let q = quizData[currentQuestion];

document.getElementById("question-number").innerText =
"Question " + (currentQuestion+1);

document.getElementById("question").innerText = q.question;

let optionsHTML="";

q.options.forEach((option,index)=>{

optionsHTML +=
`<div class="option" onclick="selectAnswer(${index})">
${option}
</div>`;

});

document.getElementById("options").innerHTML = optionsHTML;

}

function selectAnswer(index){

if(index === quizData[currentQuestion].answer){
score++;
}

}

document.getElementById("nextBtn").onclick = function(){

currentQuestion++;

if(currentQuestion < quizData.length){
loadQuestion();
}else{
showResult();
}

};

function showResult(){

clearInterval(timer);

document.getElementById("quiz-screen").style.display="none";
document.getElementById("result-screen").style.display="block";

let percentage = (score/quizData.length)*100;

document.getElementById("result").innerText =
studentName + ", your score is " + score + "/" +
quizData.length + " (" + percentage + "%)";

}
function restart(){
  document.getElementById("quiz-screen").style.display="block";
document.getElementById("result-screen").style.display="none";


startQuiz();
}
  </script>

</body>
</html>
